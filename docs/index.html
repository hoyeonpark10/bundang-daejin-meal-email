<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분당대진고 급식 안내</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-soft: #2563eb1a;
    --shadow: rgba(0, 0, 0, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317;
      --card-bg: #1b1e24;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #2a2e37;
      --accent: #60a5fa;
      --accent-soft: #60a5fa26;
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 4rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 0.25rem;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 1.5rem;
  }

  /* 달력 */
  .weekday-row, .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .weekday-row {
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  .calendar-grid {
    margin-bottom: 1rem;
  }
  .day-cell {
    aspect-ratio: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    padding: 4px 2px;
    font-size: 0.7rem;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transition: border-color 0.15s, background 0.15s;
  }
  .day-cell.blank {
    visibility: hidden;
    cursor: default;
  }
  .day-cell.empty {
    color: var(--muted);
    opacity: 0.55;
  }
  .day-cell:not(.blank):hover {
    border-color: var(--accent);
  }
  .day-cell.today {
    border-color: var(--accent);
    border-width: 2px;
    font-weight: 600;
  }
  .day-cell.active {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .cell-date {
    font-size: 0.72rem;
  }
  .cell-emojis {
    font-size: 0.82rem;
    line-height: 1;
    letter-spacing: -1px;
  }
  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
    margin: 0 0 1.5rem;
  }

  /* 말풍선(툴팁) */
  #tooltip {
    position: fixed;
    z-index: 20;
    width: min(300px, 86vw);
    max-height: 70vh;
    overflow-y: auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    box-shadow: 0 8px 24px var(--shadow);
    font-size: 0.85rem;
  }
  #tooltip[hidden] {
    display: none;
  }
  .date-badge {
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }
  .meal-block {
    margin-bottom: 1rem;
  }
  .meal-block:last-child {
    margin-bottom: 0;
  }
  .meal-block h2 {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 0.95rem;
    margin: 0 0 0.5rem;
  }
  .meal-block .calorie {
    font-size: 0.78rem;
    color: var(--muted);
    font-weight: normal;
  }
  .dish-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .dish-list li {
    padding: 0.22rem 0;
    border-bottom: 1px dashed var(--border);
  }
  .dish-list li:last-child {
    border-bottom: none;
  }
  .empty {
    color: var(--muted);
    font-size: 0.88rem;
    margin: 0;
  }
  details {
    margin-top: 0.5rem;
    font-size: 0.78rem;
    color: var(--muted);
  }
  summary {
    cursor: pointer;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 0.4rem;
    font-size: 0.78rem;
  }
  td {
    padding: 0.2rem 0.4rem;
    border-bottom: 1px solid var(--border);
  }
  footer {
    margin-top: 1rem;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
  }

  @media (max-width: 420px) {
    .day-cell { font-size: 0.62rem; border-radius: 8px; }
    .cell-emojis { font-size: 0.72rem; }
  }
</style>
</head>
<body>
<main>
  <h1>🏫 분당대진고등학교 급식 달력</h1>
  <p class="subtitle">앞으로 30일치 급식 정보를 매일 밤 22시(KST)에 자동으로 갱신합니다.</p>

  <div class="weekday-row">
    <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
  </div>
  <div id="calendar" class="calendar-grid">
    <p class="empty">달력을 불러오는 중...</p>
  </div>
  <p class="hint">날짜에 마우스를 올리면(모바일은 탭) 그날 급식이 바로 옆에 떠요.</p>

  <footer id="footer">데이터 출처: 나이스(NEIS) 교육정보 개방 포털</footer>
</main>

<div id="tooltip" hidden></div>

<script>
const MEAL_ORDER = ["중식", "석식"];
const MEAL_EMOJI = { "중식": "🍱", "석식": "🌙" };

function getLocalDateStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + d;
}

function weekdayIndexFromLabel(label) {
  // "일,월,화,수,목,금,토" -> 0~6 (일요일을 0으로)
  const order = ["일", "월", "화", "수", "목", "금", "토"];
  return order.indexOf(label);
}

function dayHasData(day) {
  return !!(day.meals["중식"] || day.meals["석식"]);
}

function summaryEmojis(day) {
  const seen = [];
  for (const mealName of MEAL_ORDER) {
    const meal = day.meals[mealName];
    if (!meal) continue;
    for (const dish of meal.dishes) {
      for (const e of (dish.emojis || [])) {
        if (!seen.includes(e)) seen.push(e);
      }
    }
  }
  return seen.slice(0, 4);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

function buildTooltipHtml(day) {
  const parts = [];
  parts.push('<div class="date-badge">📅 ' + escapeHtml(day.date) + ' (' + escapeHtml(day.weekday) + ')</div>');

  for (const mealName of MEAL_ORDER) {
    const meal = day.meals[mealName];
    const emoji = MEAL_EMOJI[mealName];

    if (!meal) {
      parts.push(
        '<div class="meal-block"><h2>' + emoji + ' ' + mealName + '</h2>' +
        '<p class="empty">등록된 급식 정보가 없습니다.</p></div>'
      );
      continue;
    }

    const dishItems = meal.dishes.map(function (d) {
      const emojis = d.emojis || [];
      const prefix = emojis.length ? emojis.join("") + " " : "";
      return "<li>" + prefix + escapeHtml(d.name) + "</li>";
    }).join("");

    const nutritionRows = Object.entries(meal.nutrition || {})
      .map(function (entry) {
        return "<tr><td>" + escapeHtml(entry[0]) + "</td><td>" + escapeHtml(entry[1]) + "</td></tr>";
      })
      .join("");

    parts.push(
      '<div class="meal-block">' +
        '<h2>' + emoji + ' ' + mealName + ' <span class="calorie">' + escapeHtml(meal.calorie || "") + '</span></h2>' +
        '<ul class="dish-list">' + dishItems + '</ul>' +
        (nutritionRows ? '<details><summary>영양 정보</summary><table>' + nutritionRows + '</table></details>' : '') +
      '</div>'
    );
  }

  return parts.join("");
}

// ---- 툴팁 표시/위치/숨김 ----
const tooltipEl = document.getElementById("tooltip");
let hideTimer = null;
let activeCell = null;

function cancelHide() {
  if (hideTimer) {
    clearTimeout(hideTimer);
    hideTimer = null;
  }
}

function scheduleHide() {
  cancelHide();
  hideTimer = setTimeout(function () {
    tooltipEl.hidden = true;
    if (activeCell) {
      activeCell.classList.remove("active");
      activeCell = null;
    }
  }, 180);
}

function positionTooltip(rect) {
  const margin = 8;
  const tw = tooltipEl.offsetWidth;
  const th = tooltipEl.offsetHeight;

  let left = rect.left;
  if (left + tw > window.innerWidth - margin) left = window.innerWidth - tw - margin;
  if (left < margin) left = margin;

  let top = rect.bottom + margin;
  if (top + th > window.innerHeight - margin) {
    top = rect.top - th - margin;
    if (top < margin) top = margin;
  }

  tooltipEl.style.left = left + "px";
  tooltipEl.style.top = top + "px";
}

function showTooltipFor(cell, day) {
  cancelHide();
  if (activeCell && activeCell !== cell) activeCell.classList.remove("active");
  activeCell = cell;
  cell.classList.add("active");

  tooltipEl.innerHTML = buildTooltipHtml(day);
  tooltipEl.hidden = false;
  positionTooltip(cell.getBoundingClientRect());
}

tooltipEl.addEventListener("mouseenter", cancelHide);
tooltipEl.addEventListener("mouseleave", scheduleHide);

document.addEventListener("click", function (event) {
  if (event.target.closest("#tooltip") || event.target.closest(".day-cell")) return;
  tooltipEl.hidden = true;
  if (activeCell) {
    activeCell.classList.remove("active");
    activeCell = null;
  }
});

function renderCalendar(days) {
  const grid = document.getElementById("calendar");
  grid.innerHTML = "";

  const firstWeekdayIndex = weekdayIndexFromLabel(days[0].weekday);
  const todayStr = getLocalDateStr(new Date());

  for (let i = 0; i < firstWeekdayIndex; i++) {
    const blank = document.createElement("div");
    blank.className = "day-cell blank";
    grid.appendChild(blank);
  }

  days.forEach(function (day) {
    const cell = document.createElement("div");
    const hasData = dayHasData(day);
    const classes = ["day-cell"];
    if (!hasData) classes.push("empty");
    if (day.date === todayStr) classes.push("today");
    cell.className = classes.join(" ");

    const dayNum = day.date.split("-")[2];
    const monthNum = day.date.split("-")[1];
    const emojis = summaryEmojis(day);

    cell.innerHTML =
      '<div class="cell-date">' + monthNum + '/' + dayNum + '</div>' +
      '<div class="cell-emojis">' + emojis.join(" ") + '</div>';

    cell.addEventListener("mouseenter", function () {
      showTooltipFor(cell, day);
    });
    cell.addEventListener("mouseleave", scheduleHide);
    cell.addEventListener("click", function (event) {
      event.stopPropagation();
      showTooltipFor(cell, day);
    });

    grid.appendChild(cell);
  });
}

async function loadData() {
  try {
    const res = await fetch("data.json", { cache: "no-store" });
    if (!res.ok) throw new Error("데이터를 불러오지 못했습니다.");
    const data = await res.json();

    renderCalendar(data.days);

    document.getElementById("footer").textContent =
      "데이터 출처: 나이스(NEIS) 교육정보 개방 포털 · 마지막 생성: " + data.generated_at + " (KST)";
  } catch (err) {
    document.getElementById("calendar").innerHTML =
      '<p class="empty">급식 정보를 불러오지 못했습니다. (' + err.message + ')</p>';
  }
}

loadData();
</script>
</body>
</html>
