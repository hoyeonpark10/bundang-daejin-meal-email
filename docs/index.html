<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분당대진고 급식 안내</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #15171c;
    --muted: #68707c;
    --border: #e6e8ec;
    --accent: #2f6fed;
    --accent-soft: #2f6fed14;
    --accent-ring: #2f6fed40;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 2px 8px rgba(16, 24, 40, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card-bg: #1a1d23;
      --text: #f2f3f5;
      --muted: #9aa1ac;
      --border: #2a2d35;
      --accent: #5b8cff;
      --accent-soft: #5b8cff1f;
      --accent-ring: #5b8cff55;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 12px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body {
    margin: 0;
    padding: 1.25rem 1rem 3rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.55;
  }
  .page {
    max-width: 480px;
    margin: 0 auto;
  }

  /* 헤더 */
  .app-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
  }
  .app-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 0.75rem;
    background: var(--accent-soft);
    font-size: 1.3rem;
    flex-shrink: 0;
  }
  .app-header h1 {
    font-size: 1.15rem;
    margin: 0;
    line-height: 1.3;
  }
  .app-sub {
    margin: 0.1rem 0 0;
    font-size: 0.82rem;
    color: var(--muted);
  }

  /* 선택된 날짜 카드 */
  .meal-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 1rem;
    box-shadow: var(--shadow);
    padding: 1.1rem 1.2rem 1.2rem;
    margin-bottom: 1.5rem;
    scroll-margin-top: 1rem;
  }
  .meal-card-date {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.9rem;
  }
  .meal-card-date .date-main {
    font-size: 1.05rem;
    font-weight: 700;
  }
  .meal-card-date .date-tag {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
  }
  .meal-block {
    margin-bottom: 1.1rem;
  }
  .meal-block:last-child {
    margin-bottom: 0;
  }
  .meal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.55rem;
  }
  .meal-name {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.95rem;
    font-weight: 700;
  }
  .meal-calorie {
    font-size: 0.78rem;
    color: var(--muted);
    font-weight: 500;
  }
  .dish-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }
  .dish-list li {
    font-size: 0.95rem;
    padding-bottom: 0.35rem;
    border-bottom: 1px solid var(--border);
  }
  .dish-list li:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }
  .dish-emojis {
    margin-right: 0.3rem;
  }
  .empty-msg {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0;
  }
  details.nutrition {
    margin-top: 0.6rem;
  }
  details.nutrition summary {
    font-size: 0.82rem;
    color: var(--accent);
    font-weight: 600;
    cursor: pointer;
    list-style: none;
  }
  details.nutrition summary::-webkit-details-marker { display: none; }
  details.nutrition summary::before {
    content: "▸ ";
  }
  details.nutrition[open] summary::before {
    content: "▾ ";
  }
  .nutrition-grid {
    margin-top: 0.6rem;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
  }
  .nutrition-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    padding: 0.45rem 0.5rem;
    text-align: center;
  }
  .nutrition-item .n-label {
    display: block;
    font-size: 0.68rem;
    color: var(--muted);
    margin-bottom: 0.15rem;
  }
  .nutrition-item .n-value {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
  }

  /* 달력 */
  .calendar-section {
    margin-bottom: 1.5rem;
  }
  .calendar-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }
  .calendar-head h2 {
    font-size: 0.95rem;
    margin: 0;
  }
  .calendar-range {
    font-size: 0.78rem;
    color: var(--muted);
  }
  .weekday-row, .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .weekday-row {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.45rem;
    font-weight: 600;
  }
  .day-cell {
    aspect-ratio: 1;
    border: 1px solid var(--border);
    border-radius: 0.65rem;
    background: var(--card-bg);
    padding: 0;
    font: inherit;
    color: var(--text);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    touch-action: manipulation;
    transition: border-color 0.12s, background 0.12s, transform 0.08s;
  }
  .day-cell:active {
    transform: scale(0.94);
  }
  .day-cell.blank {
    visibility: hidden;
    cursor: default;
    pointer-events: none;
  }
  .day-cell.empty {
    color: var(--muted);
    opacity: 0.5;
  }
  .day-cell.today {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-ring) inset;
  }
  .day-cell.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .day-cell.selected .cell-emojis {
    filter: grayscale(0.15) brightness(1.3);
  }
  .cell-date {
    font-size: 0.82rem;
    font-weight: 700;
  }
  .cell-emojis {
    font-size: 0.78rem;
    line-height: 1;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 1.5rem 0;
  }

  footer {
    margin-top: 1.5rem;
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
<div class="page">
  <header class="app-header">
    <span class="app-icon">🏫</span>
    <div>
      <h1>분당대진고 급식</h1>
      <p class="app-sub">매일 밤 22시(KST) 자동 갱신</p>
    </div>
  </header>

  <section id="meal-card" class="meal-card">
    <p class="empty-state">불러오는 중...</p>
  </section>

  <section class="calendar-section">
    <div class="calendar-head">
      <h2>📅 급식 달력</h2>
      <span class="calendar-range" id="range-label"></span>
    </div>
    <div class="weekday-row">
      <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
    </div>
    <div id="calendar" class="calendar-grid">
      <p class="empty-state">달력을 불러오는 중...</p>
    </div>
  </section>

  <footer id="footer">데이터 출처: 나이스(NEIS) 교육정보 개방 포털</footer>
</div>

<script>
const MEAL_ORDER = ["중식", "석식"];
const MEAL_EMOJI = { "중식": "🍱", "석식": "🌙" };

function getLocalDateStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + d;
}

function weekdayIndexFromLabel(label) {
  const order = ["일", "월", "화", "수", "목", "금", "토"];
  return order.indexOf(label);
}

function dayHasData(day) {
  return !!(day.meals["중식"] || day.meals["석식"]);
}

function summaryEmojis(day) {
  const seen = [];
  for (const mealName of MEAL_ORDER) {
    const meal = day.meals[mealName];
    if (!meal) continue;
    for (const dish of meal.dishes) {
      for (const e of (dish.emojis || [])) {
        if (!seen.includes(e)) seen.push(e);
      }
    }
  }
  return seen.slice(0, 2);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

function formatDateLabel(dateStr, weekday) {
  const [y, m, d] = dateStr.split("-");
  return y + "년 " + m + "월 " + d + "일 (" + weekday + ")";
}

function renderMealCard(day, isToday) {
  const card = document.getElementById("meal-card");
  if (!day) {
    card.innerHTML = '<p class="empty-state">날짜를 선택해보세요.</p>';
    return;
  }

  const parts = [];
  parts.push(
    '<div class="meal-card-date">' +
      '<span class="date-main">' + escapeHtml(formatDateLabel(day.date, day.weekday)) + '</span>' +
      (isToday ? '<span class="date-tag">오늘</span>' : '') +
    '</div>'
  );

  for (const mealName of MEAL_ORDER) {
    const meal = day.meals[mealName];
    const emoji = MEAL_EMOJI[mealName];

    if (!meal) {
      parts.push(
        '<div class="meal-block">' +
          '<div class="meal-head"><span class="meal-name">' + emoji + ' ' + mealName + '</span></div>' +
          '<p class="empty-msg">등록된 급식 정보가 없습니다.</p>' +
        '</div>'
      );
      continue;
    }

    const dishItems = meal.dishes.map(function (d) {
      const emojis = d.emojis || [];
      const prefix = emojis.length ? '<span class="dish-emojis">' + emojis.join("") + '</span>' : "";
      return "<li>" + prefix + escapeHtml(d.name) + "</li>";
    }).join("");

    const nutritionItems = Object.entries(meal.nutrition || {})
      .map(function (entry) {
        return (
          '<div class="nutrition-item">' +
            '<span class="n-label">' + escapeHtml(entry[0]) + '</span>' +
            '<span class="n-value">' + escapeHtml(entry[1]) + '</span>' +
          '</div>'
        );
      })
      .join("");

    parts.push(
      '<div class="meal-block">' +
        '<div class="meal-head">' +
          '<span class="meal-name">' + emoji + ' ' + mealName + '</span>' +
          '<span class="meal-calorie">' + escapeHtml(meal.calorie || "") + '</span>' +
        '</div>' +
        '<ul class="dish-list">' + dishItems + '</ul>' +
        (nutritionItems
          ? '<details class="nutrition"><summary>영양 정보 보기</summary><div class="nutrition-grid">' + nutritionItems + '</div></details>'
          : '') +
      '</div>'
    );
  }

  card.innerHTML = parts.join("");
}

function renderCalendar(days, todayStr) {
  const grid = document.getElementById("calendar");
  grid.innerHTML = "";

  const firstWeekdayIndex = weekdayIndexFromLabel(days[0].weekday);
  let selectedCell = null;

  for (let i = 0; i < firstWeekdayIndex; i++) {
    const blank = document.createElement("div");
    blank.className = "day-cell blank";
    grid.appendChild(blank);
  }

  days.forEach(function (day) {
    const cell = document.createElement("button");
    cell.type = "button";
    const hasData = dayHasData(day);
    const isToday = day.date === todayStr;

    const classes = ["day-cell"];
    if (!hasData) classes.push("empty");
    if (isToday) classes.push("today");
    cell.className = classes.join(" ");
    cell.setAttribute("aria-label", day.date + " " + day.weekday + "요일");

    const dayNum = day.date.split("-")[2];
    const monthNum = day.date.split("-")[1];
    const emojis = summaryEmojis(day);

    cell.innerHTML =
      '<span class="cell-date">' + monthNum + '/' + dayNum + '</span>' +
      '<span class="cell-emojis">' + emojis.join(" ") + '</span>';

    cell.addEventListener("click", function () {
      if (selectedCell) selectedCell.classList.remove("selected");
      cell.classList.add("selected");
      selectedCell = cell;
      renderMealCard(day, isToday);
      document.getElementById("meal-card").scrollIntoView({ behavior: "smooth", block: "start" });
    });

    if (isToday) {
      selectedCell = cell;
    }

    grid.appendChild(cell);
  });

  if (selectedCell) selectedCell.classList.add("selected");
}

async function loadData() {
  try {
    const res = await fetch("data.json", { cache: "no-store" });
    if (!res.ok) throw new Error("데이터를 불러오지 못했습니다.");
    const data = await res.json();

    const todayStr = getLocalDateStr(new Date());
    renderCalendar(data.days, todayStr);

    const todayEntry = data.days.find(function (d) { return d.date === todayStr; });
    renderMealCard(todayEntry || data.days[0], !!todayEntry);

    if (data.days.length) {
      document.getElementById("range-label").textContent =
        data.days[0].date + " ~ " + data.days[data.days.length - 1].date;
    }
    document.getElementById("footer").textContent =
      "데이터 출처: 나이스(NEIS) 교육정보 개방 포털 · 마지막 생성: " + data.generated_at + " (KST)";
  } catch (err) {
    document.getElementById("calendar").innerHTML =
      '<p class="empty-state">급식 정보를 불러오지 못했습니다. (' + err.message + ')</p>';
    document.getElementById("meal-card").innerHTML =
      '<p class="empty-state">급식 정보를 불러오지 못했습니다.</p>';
  }
}

loadData();
</script>
</body>
</html>
