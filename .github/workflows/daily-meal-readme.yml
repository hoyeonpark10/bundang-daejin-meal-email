name: 분당대진고 급식 정보 업데이트

on:
  schedule:
    # UTC 13:00 = KST 22:00 (같은 날). GitHub Actions 스케줄은 부하에 따라
    # 몇 분 정도 지연될 수 있습니다.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-outputs:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: README 급식 정보 업데이트
        run: python update_readme.py

      - name: 웹사이트 데이터(docs/data.json) 업데이트
        run: python update_site_data.py

      - name: 변경사항 커밋 & 푸시
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 급식 정보 업데이트"
          file_pattern: "README.md docs/data.json"
