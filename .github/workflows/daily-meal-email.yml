name: 분당대진고 급식 이메일 발송

on:
  schedule:
    # UTC 21:00 = KST 06:00 (다음날). GitHub Actions 스케줄은 부하에 따라
    # 몇 분 정도 지연될 수 있습니다.
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  send-meal-email:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: (임시) secret 값 점검
        env:
          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}
          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python debug_secrets.py

      - name: 급식 이메일 발송
        env:
          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}
          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python send_meal_email.py
